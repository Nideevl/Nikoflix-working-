name: Deploy NikoFlix Backend to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Decode SSH key
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" | base64 -d > private_key
          chmod 600 private_key

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: private_key
          script: |
            cd ~/Nikoflix-working
            git pull
            cd backend
            npm install
            pm2 restart nikoflix-backend || pm2 start src/server.js --name nikoflix-backend
