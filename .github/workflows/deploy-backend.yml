name: Deploy NikoFlix Backend to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # STEP 1 — verify secrets exist
      - name: Check secrets presence
        run: |
          echo "Checking secrets..."

          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "VM_HOST missing"; exit 1;
          else
            echo "VM_HOST exists";
          fi

          if [ -z "${{ secrets.VM_USER }}" ]; then
            echo "VM_USER missing"; exit 1;
          else
            echo "VM_USER exists";
          fi

          if [ -z "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "VM_SSH_KEY missing"; exit 1;
          else
            echo "VM_SSH_KEY exists";
          fi


      # STEP 2 — write SSH key to file EXACTLY like local machine
      - name: Prepare SSH key
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          ls -la key.pem


      # STEP 3 — test raw SSH connection (this is critical)
      - name: Test SSH connection
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "echo SSH SUCCESS"


      # STEP 4 — actual deployment
      - name: Deploy backend
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            cd ~/Nikoflix-working
            git pull
            cd backend
            npm install
            pm2 restart nikoflix-backend || pm2 start src/server.js --name nikoflix-backend
          EOF
