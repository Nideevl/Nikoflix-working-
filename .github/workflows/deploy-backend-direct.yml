name: Deploy NikoFlix Backend to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # STEP 1 — confirm secrets exist
      - name: Check secrets presence
        run: |
          echo "Checking secrets..."
          [ -z "${{ secrets.VM_HOST }}" ] && echo "VM_HOST missing" && exit 1 || echo "VM_HOST ok"
          [ -z "${{ secrets.VM_USER }}" ] && echo "VM_USER missing" && exit 1 || echo "VM_USER ok"
          [ -z "${{ secrets.VM_SSH_KEY }}" ] && echo "VM_SSH_KEY missing" && exit 1 || echo "VM_SSH_KEY ok"


      # STEP 2 — write SSH private key to file
      - name: Prepare SSH key
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > key.pem
          chmod 600 key.pem


      # STEP 3 — set connection variables from secrets
      - name: Set connection variables
        run: |
          echo "HOST=${{ secrets.VM_HOST }}" >> $GITHUB_ENV
          echo "USER=${{ secrets.VM_USER }}" >> $GITHUB_ENV


      # STEP 4 — test SSH connection
      - name: SSH test connection
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no $USER@$HOST "echo CONNECTED"


      # STEP 5 — deploy backend
      - name: Deploy backend
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no $USER@$HOST "
            cd ~/Nikoflix-working &&
            git reset --hard &&
            git pull &&
            cd backend &&
            npm install &&
            pm2 restart nikoflix-backend || pm2 start backend/src/server.js --name nikoflix-backend
          "

